services:
  backend:
    build:
      context: ./backend
    container_name: property-backend

    ports:
      - "4000:4000"

    volumes:
      - ./backend:/app
      - /app/node_modules

    environment:
      NODE_ENV: development

    command: npm run dev

  web:
    build:
      context: ./web
    container_name: property-web

    ports:
      - "5173:5173"

    volumes:
      - ./web:/app
      - /app/node_modules

    depends_on:
      - backend

    command: npm run dev -- --host 0.0.0.0